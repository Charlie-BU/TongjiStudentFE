stages:
  - build
  - deploy

default:
  image: node:22

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

build:
  stage: build
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - mv dist public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
